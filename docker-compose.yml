services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anweshan-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=file:/app/prisma/anweshan.db
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=http://localhost:8080,http://frontend,https://deep.tail0fa17c.ts.net
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - PUBLIC_URL=https://deep.tail0fa17c.ts.net
      - ML_SERVICE_URL=http://ml:5001
    depends_on:
      - ml
    restart: unless-stopped

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: anweshan-ml
    expose:
      - "5001"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anweshan-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped


